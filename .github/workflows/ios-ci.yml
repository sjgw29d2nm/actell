name: iOS CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_only:
        description: 'Only check sources and build the unsigned device app'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-project:
    name: Source and project checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install source-check dependencies
        run: |
          python -m venv .build/qa-venv
          .build/qa-venv/bin/python -m pip install -r ios-app/scripts/requirements-qa.txt

      - name: Check generated Xcode project is current
        run: |
          .build/qa-venv/bin/python ios-app/scripts/generate_xcode_project.py
          git diff --exit-code -- ios-app/PhoneAgent.xcodeproj
          test -z "$(git status --porcelain -- ios-app/PhoneAgent.xcodeproj)"

      - name: Check Swift source and project configuration
        run: .build/qa-venv/bin/python ios-app/scripts/check_source.py

      - name: Check USB wire contract
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        run: .build/qa-venv/bin/python ios-app/scripts/test_contract.py

      - name: Check patch formatting
        run: git diff --check

  ios-build-and-tests:
    name: iOS build and simulator tests
    needs: source-and-project
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check USB Device protocol and TCP loopback
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        run: CC=clang bash tools/test_usb_device.sh

      - name: Select Xcode and prepare Rust targets
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install stable --profile minimal
          "$HOME/.cargo/bin/rustup" default stable
          "$HOME/.cargo/bin/rustup" target add aarch64-apple-ios aarch64-apple-ios-sim
          xcodebuild -version

      - name: Resolve pinned Swift packages
        run: |
          mkdir -p .build/SourcePackages
          xcodebuild -resolvePackageDependencies \
            -project ios-app/PhoneAgent.xcodeproj \
            -scheme PhoneAgent \
            -clonedSourcePackagesDirPath .build/SourcePackages

      - name: Build unsigned iPhoneOS app
        run: |
          xcodebuild \
            -project ios-app/PhoneAgent.xcodeproj \
            -scheme PhoneAgent \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DerivedData \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -disableAutomaticPackageResolution -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package unsigned device app
        run: |
          tar -C .build/DerivedData/Build/Products/Debug-iphoneos \
            -czf .build/PhoneAgent-unsigned.tar.gz PhoneAgent.app

      - name: Upload unsigned device app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-device-unsigned
          path: .build/PhoneAgent-unsigned.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Select an iOS 27 iPhone simulator
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        id: simulator
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; candidates=[device["udid"] for runtime, entries in devices.items() if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-27") for device in entries if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]; print(candidates[0] if candidates else "")')"
          if [ -z "$simulator_id" ]; then
            echo 'No available iOS 27 iPhone simulator was found.' >&2
            exit 1
          fi
          echo "udid=$simulator_id" >> "$GITHUB_OUTPUT"

      - name: Boot simulator for UI fixtures
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.udid }}' || true
          xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b

      - name: Run core and UI tests
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        env:
          RUN_UI_TESTS: '1'
        run: bash ios-app/scripts/test_core.sh '${{ steps.simulator.outputs.udid }}'

      - name: Upload failed iOS test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-diagnostics
          path: |
            .build/validation/core.*/test.log
            .build/validation/core.*/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 7
